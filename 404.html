<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0;url=/?p=%2F" />
    <script>
        (function () {
            // Keep path + search (minus leading "/") and hash
            var l = window.location;
            var p = l.pathname + l.search;
            // Redirect to /?p=<encoded path> so index.html can restore it
            var target = "/?p=" + encodeURIComponent(p) + l.hash;
            window.location.replace(target);
        })();
    </script>
</head>

<body>Redirecting…</body>

</html>
