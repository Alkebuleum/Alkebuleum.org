<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Generate logo-purple.png</title></head>
<body style="font-family:sans-serif;padding:40px;background:#111;color:#fff">
<h2>Generating logo-purple.png…</h2>
<p id="status">Please wait…</p>
<canvas id="c" width="512" height="512" style="display:block;margin-top:24px;border:1px solid #444"></canvas>
<script>
const svg = `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#06060a"/>
  <g transform="translate(256,256) scale(3.8) translate(-50,-55)">
    <path fill="#8b6dff" d="M50,7 L86,28 Q90,30.5 90,35 L90,75 Q90,79.5 86,82 L50,103 L14,82 Q10,79.5 10,75 L10,35 Q10,30.5 14,28 Z"/>
    <line stroke="#ffffff" stroke-width="5" stroke-linecap="round" x1="50" y1="27" x2="50" y2="83"/>
    <polyline fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="30,42 42,55 30,68"/>
    <polyline fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="20,45 29.3,55 20,65"/>
    <polyline fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="70,42 58,55 70,68"/>
    <polyline fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="80,45 70.7,55 80,65"/>
  </g>
</svg>`;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const blob = new Blob([svg], { type: 'image/svg+xml' });
const url = URL.createObjectURL(blob);
const img = new Image();

img.onload = () => {
  ctx.drawImage(img, 0, 0, 512, 512);
  URL.revokeObjectURL(url);

  const link = document.createElement('a');
  link.download = 'logo-purple.png';
  link.href = canvas.toDataURL('image/png');
  link.click();

  document.getElementById('status').textContent = '✓ logo-purple.png downloaded — move it to public/ then commit.';
};

img.onerror = () => {
  document.getElementById('status').textContent = 'Error loading SVG. Try opening this file via a local server (npx serve public).';
};

img.src = url;
</script>
</body>
</html>
